name: 🔎 تحقّق مشاريع جوجل
# يتأكد إن كل مشروع مضبوط على **قناتنا** قبل ما المصنع ينشر بيه (ويسجّل النتيجة)
on:
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * *'      # كل يوم قبل الفجر بتوقيتنا
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: تحقّق
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
        run: python tools/verify_projects.py
      - name: حفظ النتيجة
        run: |
          git config user.name "Dollars Factory"; git config user.email "factory@dawshax.local"
          git add state/youtube_projects.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🔎 تحقّق مشاريع جوجل"
          for i in 1 2 3; do git pull --rebase --autostash -q origin main 2>/dev/null || true; git push -q origin HEAD:main && break || sleep 5; done
