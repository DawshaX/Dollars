name: 🧠 العقل الذاتي (كل يوم)
on:
  schedule:
    - cron: '30 4 * * *'          # 04:30 UTC كل يوم
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: studio-daily
  cancel-in-progress: false
jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: أرقام السوق الحقيقية (يوتيوب)
        run: python engine/refs.py --trends --apply || echo "تعذّر البحث النهاردة"
      - name: تجهيز الأدوات
        run: python -m pip install --quiet numpy pillow imageio-ffmpeg
      - name: مزامنة أرقام يوتيوب الحقيقية (الوكيل المراقب)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python engine/analytics.py --sync || echo "لسه مفيش أرقام — بنكمّل"
      - name: تشغيل العقل (تعلّم من الأرقام + أفكار + شخصيات جديدة + خطة اليوم)
        run: python engine/agent.py
      - name: تحديث فهرس المكتبة
        run: python tools/build_library.py
      - name: حفظ كل حاجة على جيت هوب
        run: |
          git config user.name "Dollars Brain"
          git config user.email "brain@dawshax.local"
          git add state content assets 2>/dev/null || true
          if git diff --cached --quiet; then echo "مفيش جديد"; exit 0; fi
          git commit -m "🧠 العقل الذاتي: خطة اليوم + أفكار جديدة + شخصيات (تشغيل تلقائي)"
          git pull --rebase --autostash origin main
          git push origin main
      - name: تقرير اليوم (أرشيف)
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            state/daily_report.md
            state/ideas.json
            state/plan_*.json
            content/characters.json
          retention-days: 30
