name: 🧠 العقل الذاتي (كل يوم)
on:
  schedule:
    - cron: '30 4 * * *'          # 04:30 UTC كل يوم
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: studio-daily
  cancel-in-progress: false
jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: أرقام السوق الحقيقية (يوتيوب)
        run: python engine/refs.py --trends2 --apply || echo "تعذّر البحث النهاردة — بنكمّل عادي"
      - name: تجهيز الأدوات
        run: python -m pip install --quiet numpy pillow imageio-ffmpeg
      - name: مزامنة أرقام يوتيوب الحقيقية (الوكيل المراقب)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: python engine/analytics.py --sync || echo "لسه مفيش أرقام — بنكمّل"
      - name: تشغيل العقل (تعلّم من الأرقام + أفكار + شخصيات جديدة + خطة اليوم)
        run: python engine/agent.py
      - name: 🔎 فحص القناة الكامل (كل الفيديوهات — مش سجلنا بس)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: python tools/channel_audit.py --telegram || echo "فحص القناة تعذّر النهاردة — بنكمّل"
      - name: تقرير الأداء على تليجرام (يلوّي على الإعداد من نفسه)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: python engine/analytics.py --sync --telegram || echo "تقرير تليجرام اتفشكل النهاردة — بنكمّل"
      - name: تحديث فهرس المكتبة
        run: python tools/build_library.py
      - name: حفظ كل حاجة على جيت هوب
        run: |
          git config user.name "Dollars Brain"
          git config user.email "brain@dawshax.local"
          git add state content assets 2>/dev/null || true
          if git diff --cached --quiet; then echo "مفيش جديد"; exit 0; fi
          git commit -m "🧠 العقل الذاتي: خطة اليوم + أفكار جديدة + شخصيات (تشغيل تلقائي)"
          git fetch -q origin main || true
          if ! git pull --rebase --autostash origin main; then
            echo "⚠️ تعارض في الدمج — بنوحّد ملفات الحالة وبنكمّل"
            git rebase --abort 2>/dev/null || true
            git merge -X ours --no-edit origin/main 2>/dev/null || true
          fi
          python3 tools/merge_state.py origin/main >/dev/null 2>&1 || true
          git add state 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "🔀 توحيد حالة المصنع (اتحاد)" || true
          git push origin main
      - name: تقرير اليوم (أرشيف)
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            state/daily_report.md
            state/ideas.json
            state/channel_audit.json
            state/channel_audit.md
            state/plan_*.json
            content/characters.json
          retention-days: 30
