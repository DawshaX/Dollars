name: 🏭 المصنع — الطويلة اليومية
on:
  schedule:
    - cron: '20 1 * * *'         # فيديو نوم طويل + قصة كل يوم
    - cron: '20 13 * * *'        # احتياطي — التعويض بيمنع التكرار
  workflow_dispatch:
    inputs:
      count:
        description: "كام فيديو طويل؟"
        required: false
        default: "1"
permissions:
  contents: write
concurrency:
  group: factory-daily
  cancel-in-progress: false
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: مساحة حرة (الطويلة بتوصل جيجابايت)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1
      - run: python -m pip install --quiet numpy pillow imageio-ffmpeg
      - name: إنتاج الطويلة (3/8/10 ساعات) + قصة بلا كلام
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/factory.py --daily --catchup
      - uses: actions/upload-artifact@v4
        with:
          name: dollars-daily
          path: |
            work/**/*.jpg
            work/**/*.json
            work/**/*.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: حفظ الذاكرة
        run: |
          git config user.name "Dollars Factory"
          git config user.email "factory@dawshax.local"
          git add state 2>/dev/null || true
          if git diff --cached --quiet; then echo "مفيش تغيير"; exit 0; fi
          git commit -m "🏭 المصنع: الطويلة اليومية + السجل"
          git pull --rebase --autostash origin main
          git push origin main
