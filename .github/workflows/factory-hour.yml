name: 🏭 المصنع — كل ساعة
on:
  schedule:
    - cron: '7 * * * *'          # شورت كل ساعة (بلا حد)
    - cron: '37 * * * *'         # كرون تاني احتياطي — لو الأول اتأخر/اتلغى، التعويض بيغطّي
  workflow_dispatch:
    inputs:
      count:
        description: "كام فيديو؟"
        required: false
        default: "1"
permissions:
  contents: write
  issues: write
concurrency:
  group: factory-hour
  cancel-in-progress: false
jobs:
  hour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: مساحة حرة + الأدوات
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          python -m pip install --quiet numpy pillow imageio-ffmpeg
      - name: إنتاج شورت (مونتاج كامل + غلاف + بيانات) ونشره لو القناة مربوطة
        env:
          LIVE_ISSUE: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || secrets.PIXABAY_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELS }}
          OPENVERSE_TOKEN: ${{ secrets.OPENVERSE_TOKEN || secrets.OPENVERSE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/factory.py --hourly --catchup --count ${{ github.event.inputs.count || 1 }}
      - name: حفظ الفيديوهات كأرشيف (٣ أيام)
        uses: actions/upload-artifact@v4
        with:
          name: dollars-hour
          path: |
            work/**/*.mp4
            work/**/*.jpg
            work/**/*.json
            work/**/*.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: حفظ ذاكرة المصنع (السجل + الطابور)
        run: |
          git config user.name "Dollars Factory"
          git config user.email "factory@dawshax.local"
          git add state 2>/dev/null || true
          if git diff --cached --quiet; then echo "مفيش تغيير"; exit 0; fi
          git commit -m "🏭 المصنع: شورت الساعة $(date -u +%H:00) — سجل وطابور"
          git pull --rebase --autostash origin main
          git push origin main
