name: 📖 رندر قصة (يدوي)
on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "معرّف القصة (nono_rain · koko_star) أو all"
        required: true
        default: all
permissions:
  contents: write
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy pillow imageio-ffmpeg pytest
      - name: تشغيل الاختبارات أولًا (مفيش رندر على كود مكسور)
        run: python -m pytest tests/ -q
      - name: رندر القصة/القصص + بيانات يوتيوب
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, ".")
          from engine import story
          which = "${{ inputs.story_id }}"
          ids = [s["id"] for s in story.all_stories()] if which == "all" else [which]
          for sid in ids:
              st = story.load(sid)
              problems = st.validate()
              if problems:
                  raise SystemExit("❌ " + sid + ": " + " | ".join(problems))
              p = st.render(pathlib.Path("samples/stories") / (sid + ".mp4"), verbose=True)
              print("✅", sid, p.stat().st_size // 1024, "كيلوبايت")
              print(st.write_package("samples/stories"))
          PY
      - name: حفظ العيّنة + بيانات النشر على جيت هوب
        run: |
          git config user.name "Dollars Studio"
          git config user.email "studio@dawshax.local"
          git add content samples/stories/*.meta.json samples/stories/*.meta.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "مفيش جديد"; exit 0; fi
          git commit -m "📖 قصة جديدة اترندرت + بيانات يوتيوب جاهزة"
          git fetch -q origin main || true
          if ! git pull --rebase --autostash origin main; then
            echo "⚠️ تعارض في الدمج — بنوحّد ملفات الحالة وبنكمّل"
            git rebase --abort 2>/dev/null || true
            git merge -X ours --no-edit origin/main 2>/dev/null || true
          fi
          python3 tools/merge_state.py origin/main >/dev/null 2>&1 || true
          git add state 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "🔀 توحيد حالة المصنع (اتحاد)" || true
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: story-${{ inputs.story_id }}
          path: samples/stories/
          retention-days: 14
