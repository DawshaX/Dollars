name: 🧪 اختبارات الاستوديو
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: تجهيز الأدوات
        run: python -m pip install --quiet numpy pytest pillow
      - name: تشغيل الاختبارات
        run: python -m pytest tests/ -q
