name: 🔁 المصنع — وردية متواصلة (نشر كل ساعة مضمون)
on:
  schedule:
    - cron: '5 */6 * * *'        # ٤ كِكات في اليوم بس — والوردية نفسها بتنشر كل ساعة جوّاها
  workflow_dispatch:
    inputs:
      hours:
        description: "طول الوردية بالساعات (أقصى ٥.٥)"
        required: false
        default: "5"
      per_hour:
        description: "كام فيديو في الدورة"
        required: false
        default: "1"
      every_min:
        description: "⏱️ كل كام دقيقة ينشر (55 = كل ساعة · 120 = كل ساعتين)"
        required: false
        default: "55"
permissions:
  contents: write
  issues: write
  actions: write        # 🔗 عشان الوردية تسلّم الشغل للي بعدها (تغطية ٢٤ ساعة بلا كرون)
concurrency:
  group: factory-shift          # وردية واحدة في الوقت الواحد
  cancel-in-progress: false
jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: مساحة حرة + الأدوات
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          python -m pip install --quiet numpy pillow imageio-ffmpeg
      - name: "🔁 وردية: نشر كل ساعة بنفسها (بدون انتظار الكرون)"
        env:
          LIVE_ISSUE: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || secrets.PIXABAY_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELS }}
          OPENVERSE_TOKEN: ${{ secrets.OPENVERSE_TOKEN || secrets.OPENVERSE }}
          DOLLARS_LONG_CLIPS: '1'
          DOLLARS_SOFT_QUOTA: '1'
          DOLLARS_AR_SHARE: '0.2'
          DOLLARS_EVERY_MIN: ${{ github.event.inputs.every_min || 55 }}
          DOLLARS_SYNC: '1'
          DOLLARS_CATCHUP_MAX: '1'      # 🚦 دفع هادي: ممنوع دفع جماعي (كان بيدفن القناة)
          DOLLARS_SLOTS_PER_HOUR: '1'   # ⏰ ساعة/ساعة بالظبط (كانت الخطة ٨ في الساعة)
          DOLLARS_LOCALES: ${{ vars.DOLLARS_LOCALES || 'ar,es,pt,hi,id' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GROQ_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: |
          python engine/factory.py --shift \
            --hours "${{ github.event.inputs.hours || 5 }}" \
            --per-hour "${{ github.event.inputs.per_hour || 1 }}" \
            --every-min "${{ github.event.inputs.every_min || 55 }}"
      - name: حفظ الفيديوهات كأرشيف (٣ أيام)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dollars-shift
          path: |
            work/**/*.mp4
            work/**/*.jpg
            work/**/*.json
            work/**/*.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: 🔗 تسليم الوردية للي بعدها (تغطية ٢٤ ساعة حتى لو الكرون اتأخر)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIVE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/factory-shift.yml/runs?per_page=20" \
            | jq --arg cur "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.status=="in_progress" or .status=="queued") and ((.id|tostring) != $cur))] | length')
          echo "ورديات شغالة غير دي: $LIVE"
          if [ "$LIVE" -gt 0 ]; then echo "✅ في وردية شغالة — مش محتاج تسليم"; exit 0; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/factory-shift.yml/dispatches" \
            -d '{"ref":"main","inputs":{"hours":"5.5","per_hour":"1","every_min":"55"}}')
          echo "🔗 تسليم الوردية الجاية: HTTP $CODE"
      - name: حفظ ذاكرة المصنع (السجل + الطابور)
        if: always()
        run: |
          git config user.name "Dollars Factory"
          git config user.email "factory@dawshax.local"
          git add state 2>/dev/null || true
          if git diff --cached --quiet; then echo "مفيش تغيير"; exit 0; fi
          git commit -m "🔁 الوردية: نشر متواصل $(date -u +%Y-%m-%dT%H:%M) — سجل وطابور"
          git fetch -q origin main || true
          if ! git pull --rebase --autostash origin main; then
            echo "⚠️ تعارض في الدمج — بنوحّد ملفات الحالة وبنكمّل"
            git rebase --abort 2>/dev/null || true
            git merge -X ours --no-edit origin/main 2>/dev/null || true
          fi
          python3 tools/merge_state.py origin/main >/dev/null 2>&1 || true
          git add state 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "🔀 توحيد حالة المصنع (اتحاد)" || true
          git push origin main
