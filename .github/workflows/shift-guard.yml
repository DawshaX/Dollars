name: 🛡️ حارس الوردية (يضمن استمرار النشر كل ساعة)
on:
  schedule:
    - cron: '25 15,18,20,22 * * *'   # 🛡️ نتأكد إن في وردية قبل كل موعد ذروة      # كل ساعتين: لو مفيش وردية شغالة، يشغّل واحدة
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: هل فيه وردية شغالة الآن؟
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/factory-shift.yml/runs?per_page=5")
          LIVE=$(printf '%s' "$RUNS" | grep -c '"status": *"in_progress"' || true)
          echo "🔎 ورديات شغالة الآن: $LIVE"
          if [ "${LIVE:-0}" -gt 0 ]; then
            echo "✅ فيه وردية شغالة — مفيش حاجة نعملها"
            exit 0
          fi
          echo "⚠️ مفيش وردية شغالة — بنشغّل واحدة جديدة (النشر كل ساعة يكمل)"
          curl -s -o /dev/null -w "dispatch=%{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/factory-shift.yml/dispatches" \
            -d '{"ref":"main","inputs":{"hours":"5.5","per_hour":"1","every_min":"55"}}'
      - name: تنبيه تليجرام بحالة الحارس
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "مفيش إعدادات تليجرام"; exit 0; fi
          curl -s -o /dev/null -w "telegram=%{http_code}\n" -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            -d "text=🛡️ حارس الوردية: النشر كل ساعة مضمون — لو الوردية وقعت، الحارس بيشغّل واحدة جديدة تلقائيًا."
